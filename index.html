<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=1"><link rel="icon" href="icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Chorus"><meta name="theme-color" content="#F1EDEB"><script src="https://fuwei0618-cmd.github.io/Entry/sync/origina-sync.js" data-app="chorus" data-keys="chorus-app-v1" data-pos="br"></script>
</head><body>
<title>合唱團 App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one-hand phone app, same frame as the street app. Sticky title bar, scrolling content, fixed bottom tab bar; edits open in bottom sheets. */
:root{
  --bg:#F1EDEB; --surface:#FCFAF9; --sunk:#E7E1DE; --ink:#2A1E22; --muted:#6E5F63; --line:#D9CFCC;
  --accent:#8A2E4A; --accent-ink:#FFFFFF; --accent-soft:#F1DCE2;
  --warn:#A83E1B; --warn-bg:#F6DED3; --ok:#27704A; --ok-bg:#D9EEE0;
  --pS:#B3364A; --pS-bg:#F5DADF; --pA:#93690A; --pA-bg:#F5E8C4; --pT:#2D5E9E; --pT-bg:#DAE5F4; --pB:#2D7550; --pB-bg:#D8EEE1;
  --display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",serif;
  --body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --r:14px; --tabh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171113; --surface:#211A1C; --sunk:#100B0C; --ink:#EEE5E7; --muted:#A8979B; --line:#3A2F32;
  --accent:#E58FA9; --accent-ink:#2A0E17; --accent-soft:#3D2028;
  --warn:#F08A66; --warn-bg:#3B1E15; --ok:#6CC48F; --ok-bg:#163223;
  --pS:#F0909F; --pS-bg:#3E1C22; --pA:#E6BF5C; --pA-bg:#3A2F14; --pT:#86AEE8; --pT-bg:#1B2A40; --pB:#76C99B; --pB-bg:#163223;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171113; --surface:#211A1C; --sunk:#100B0C; --ink:#EEE5E7; --muted:#A8979B; --line:#3A2F32;
  --accent:#E58FA9; --accent-ink:#2A0E17; --accent-soft:#3D2028;
  --warn:#F08A66; --warn-bg:#3B1E15; --ok:#6CC48F; --ok-bg:#163223;
  --pS:#F0909F; --pS-bg:#3E1C22; --pA:#E6BF5C; --pA-bg:#3A2F14; --pT:#86AEE8; --pT-bg:#1B2A40; --pB:#76C99B; --pB-bg:#163223;
  color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--tabh) + 32px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.top h1{font-family:var(--display);font-weight:700;font-size:26px;margin:0;letter-spacing:.02em;display:flex;align-items:center;gap:6px;min-width:0}
.top .back{border:0;background:none;color:var(--accent);font-size:24px;padding:0 6px 0 0;line-height:1}
.top .sync{font-size:12px;color:var(--muted);white-space:nowrap}
h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
h2{font-size:20px} h3{font-size:16px}
.sec{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.label{font-size:12px;color:var(--muted);letter-spacing:.08em}
.muted{color:var(--muted)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list>li{border-top:1px solid var(--line)}
.list>li:first-child{border-top:0}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;min-height:48px;width:100%;background:none;border:0;text-align:left}
.row .main{flex:1;min-width:0}
.row .title{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.part{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;background:var(--sunk);color:var(--muted)}
.pS{background:var(--pS-bg);color:var(--pS)} .pA{background:var(--pA-bg);color:var(--pA)} .pT{background:var(--pT-bg);color:var(--pT)} .pB{background:var(--pB-bg);color:var(--pB)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.warn{color:var(--warn);border-color:var(--warn)}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:4px 12px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.ghost{background:none;border:0;color:var(--accent);font-weight:500;padding:8px 4px;min-height:40px}
.banner{border-radius:var(--r);padding:10px 14px;font-size:14px}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;text-align:left;width:100%}
.hero .when{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.15}
.hero .what{font-size:17px;font-weight:500}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted);white-space:nowrap} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:7px 10px;font-size:14px;color:var(--muted);text-align:center;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-width:0;text-align:center}
.tile b{display:block;font-size:20px;font-variant-numeric:tabular-nums;font-weight:700}
.tile span{font-size:12px;color:var(--muted)}
/* scenes */
.blockhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 14px 6px;background:var(--sunk);font-size:13px;color:var(--muted)}
.scene{display:grid;grid-template-columns:44px 1fr;gap:4px 10px;padding:12px 14px;width:100%;background:none;border:0;text-align:left}
.scene .no{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.scene .song{font-weight:700;font-family:var(--display);font-size:17px}
.scene .meta{font-size:13px;color:var(--muted)}
.scene .note{grid-column:2;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--sunk);border-radius:8px;padding:6px 10px}
/* shots */
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shot{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sunk);aspect-ratio:3/4;padding:0}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .tag{position:absolute;left:4px;bottom:4px;font-size:11px;padding:1px 6px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff}
.bigshot{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
details.fold{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.fold>summary{padding:12px 14px;font-weight:500;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"＋";color:var(--muted)}
details.fold[open]>summary::after{content:"－"}
details.fold>.inner{border-top:1px solid var(--line);padding:12px 14px}
details.fold>.list{border:0;border-top:1px solid var(--line);border-radius:0 0 var(--r) var(--r)}
.glabel{padding:8px 14px 4px;font-size:12px;color:var(--muted);letter-spacing:.08em;background:var(--sunk)}
.search{width:100%;min-height:44px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.check{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:46px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.link{color:var(--accent);text-decoration:none;overflow-wrap:anywhere}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh)}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted)}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
/* sheet */
#sheet{position:fixed;inset:0;z-index:20}
.sheet-bg{position:absolute;inset:0;background:rgba(20,10,13,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;display:flex;flex-direction:column;background:var(--bg);border-radius:18px 18px 0 0;max-width:640px;margin:0 auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet>header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.sheet>header h2{font-size:18px;text-align:center;flex:1}
.sheet-body{overflow-y:auto;padding:16px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.f{display:grid;gap:5px;min-width:0}
.f>span{font-size:13px;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.f textarea{min-height:76px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.f2{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}.shots{grid-template-columns:repeat(2,1fr)}}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick label{cursor:pointer;position:relative}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick span{display:inline-block;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.pick input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:0;display:grid;gap:10px;min-width:0}
legend{font-family:var(--display);font-weight:700;padding:0 6px}
.prop{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.prop:first-of-type{border-top:0}
.prop input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:2px}
.prop .k{font-size:12px;color:var(--muted)}
.prop .v{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.prop .old{font-size:12px;color:var(--muted);text-decoration:line-through;white-space:pre-wrap}
.think{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.25}to{opacity:1}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px)}
#viewer{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.92);display:flex;flex-direction:column}
#viewer .vt{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;color:#fff;gap:8px}
#viewer .vt button,#viewer .vt a{color:#fff;background:none;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:6px 14px;font-size:14px;text-decoration:none}
#viewer .vi{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:0 8px calc(16px + env(safe-area-inset-bottom,0px))}
#viewer img{max-width:100%;height:auto}
/* scores: page thumbnails, practice tracks, setlist */
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.pgrid{grid-template-columns:repeat(3,1fr)}}
.pthumb{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pimg{position:relative;display:block;width:100%;aspect-ratio:3/4;padding:0;border:0;background:#fff}
.pimg img{width:100%;height:100%;object-fit:contain;display:block}
.pimg .tink{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
.pbar{display:flex;align-items:center;justify-content:space-between;padding:0 2px 0 10px;font-size:13px;color:var(--muted)}
.pbar .ghost{min-height:34px;padding:4px 10px}
.nofile{display:grid;place-items:center;width:100%;height:100%;padding:8px;font-size:12px;color:#6E5F63;text-align:center;background:#F4F0EE}
.trk{padding:10px 14px;display:grid;gap:4px}
.trk .ghost{min-height:34px}
.trk audio{width:100%;height:40px}
.ghost:disabled{opacity:.3;cursor:default}
.sl{padding-right:4px}
.sl .no{width:22px;text-align:center;color:var(--muted);font-size:13px;flex:none}
.sl .sl-open{background:none;border:0;text-align:left;padding:0;min-height:40px}
.sl .ghost{min-width:34px;padding:8px 6px}
/* reader: full-screen score with ink and practice audio; always dark around the white page */
#reader{position:fixed;inset:0;z-index:45;background:#2A2426;color:#F4EFE7;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
#reader button,#reader select{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#F4EFE7;border-radius:999px;min-height:38px;padding:4px 12px;font-size:14px;white-space:nowrap}
#reader button[aria-pressed="true"]{background:#F4EFE7;color:#2A1E22;border-color:#F4EFE7}
#reader select option{color:#2A1E22;background:#fff}
#reader select:disabled{opacity:.6}
.rd-top{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px}
.rd-t{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.rd-t b{font-family:var(--display);font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rd-t select{min-width:0;max-width:100%;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis}
#rd-pg{font-size:13px;opacity:.75;white-space:nowrap}
@media (max-width:480px){#rd-pg{display:none}}
.rd-tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:0 10px 8px}
.rd-tools .sep{flex:1}
.rd-main{flex:1;min-height:0;display:flex;position:relative}
.rd-rail{width:58px;flex:none;display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0;overflow-y:auto}
#reader .rd-rail button.pre{width:44px;height:44px;min-height:0;flex:none;padding:0;border-radius:50%;border:0;background:var(--c);color:#fff;position:relative;display:grid;place-items:center;text-shadow:0 1px 2px rgba(0,0,0,.5);box-shadow:inset 0 -6px 10px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.35)}
#reader .rd-rail button.pre.hl{background:color-mix(in srgb,var(--c) 70%,#fff)}
#reader .rd-rail button.pre[aria-pressed="true"]{background:var(--c);box-shadow:0 0 0 3px #2A2426,0 0 0 5px #F4EFE7}
#reader .rd-rail button.pre.hl[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 70%,#fff)}
.rd-rail .pre b{font-size:18px;line-height:1}
.rd-rail .pre span{position:absolute;right:4px;bottom:2px;font-size:10px;font-weight:700}
.rd-rail .pre.er i{display:block;border-radius:50%;border:2px solid #fff}
#reader .rd-rail button.add{background:rgba(255,255,255,.1);border:1px dashed rgba(255,255,255,.4);box-shadow:none;font-size:20px}
.rd-edit{position:absolute;right:66px;top:8px;width:min(270px,calc(100% - 80px));background:#3A3234;border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:12px;z-index:3;display:grid;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.rd-edit-head{display:flex;align-items:center;justify-content:space-between}
.rd-cols{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
#reader .rd-cols button{width:100%;aspect-ratio:1;min-height:0;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.25)}
#reader .rd-cols button[aria-pressed="true"]{border-color:#2A2426;box-shadow:0 0 0 2px #F4EFE7}
.rd-size{display:grid;gap:4px;font-size:13px}
.rd-size input{accent-color:#E58FA9;width:100%}
.rd-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px;touch-action:none;overflow:hidden;position:relative}
.rd-pages{display:flex;gap:6px;transform-origin:0 0;flex:none}
#reader .rd-fit{position:absolute;left:12px;bottom:12px;z-index:2;background:rgba(42,36,38,.8);font-size:13px;min-height:34px}
.rd-page{position:relative;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.45);flex:none;overflow:hidden}
.rd-page img{width:100%;height:100%;display:block;pointer-events:none;-webkit-touch-callout:none}
.rd-page canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.rd-none{height:100%;display:grid;place-content:center;gap:8px;text-align:center;color:#6E5F63;padding:20px}
.rd-none b{font-family:var(--display);font-size:26px;color:#2A1E22}
.rd-audio{display:grid;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.28)}
.rd-ctl{display:flex;align-items:center;gap:8px}
.rd-ctl input[type=range]{flex:1;min-width:50px;accent-color:#E58FA9}
#rd-time{font-size:12px;opacity:.8;white-space:nowrap}
@media (max-width:480px){#rd-time{display:none}#reader .rd-ctl button,#reader .rd-ctl select{padding:4px 9px}}
#reader .rd-show{display:none}
#reader.bare .rd-show{display:block;position:absolute;right:10px;top:calc(8px + env(safe-area-inset-top,0px));z-index:4;background:rgba(42,36,38,.7);font-size:13px;min-height:34px}
#reader.bare .rd-top,#reader.bare .rd-tools,#reader.bare .rd-rail,#reader.bare .rd-edit,#reader.bare .rd-audio{display:none}
body.full .osync{display:none!important} /* OneDrive badge would cover the reader's controls */
/* scanner */
#scan{position:fixed;inset:0;z-index:46;background:var(--bg);display:flex;flex-direction:column}
.sc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(6px + env(safe-area-inset-top,0px)) 12px 6px;border-bottom:1px solid var(--line)}
.sc-top h2{font-size:18px;flex:1;text-align:center}
.sc-body{flex:1;overflow:auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;align-content:start}
@media (min-width:760px){.sc-body{grid-template-columns:1fr 300px}}
.sc-stage canvas{display:block;max-width:100%;max-height:66vh;width:auto;height:auto;margin:0 auto;touch-action:none;border-radius:8px}
.sc-side{display:grid;gap:12px;align-content:start}
.sc-pv canvas{display:block;max-width:100%;max-height:200px;margin-top:6px;border:1px solid var(--line);border-radius:6px;background:#fff}
.sc-pick{grid-column:1/-1;display:grid;gap:14px;text-align:center;padding:30px 10px;color:var(--muted)}
</style>

<div class="app">
  <header class="top"><h1 id="title">演出</h1><span class="sync" id="sync">載入中…</span></header>
  <main id="main"></main>
</div>
<div class="tabs"><nav aria-label="分頁">
  <button data-tab="shows"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H4z"/><path d="M4 5l3 4M20 5l-3 4M9 20h6M12 16v4"/></svg>演出</button>
  <button data-tab="reh"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16M8.5 14l2 2 4-4"/></svg>團練</button>
  <button data-tab="songs"><svg viewBox="0 0 24 24"><path d="M9 18V5l10-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>曲目</button>
  <button data-tab="members"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.8-3.2 3-5 5.5-5s4.7 1.8 5.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.2c2.4-.3 4.3 1.2 5 4.3"/></svg>成員</button>
  <button data-tab="notices"><svg viewBox="0 0 24 24"><path d="M4 10v4l11 5V5z"/><path d="M15 9a3 3 0 0 1 0 6M7 14.5l1 4.5h3"/></svg>公告</button>
</nav></div>
<div id="sheet" hidden></div>
<div id="viewer" hidden></div>
<div id="reader" hidden></div>
<div id="scan" hidden></div>
<div id="toast" hidden role="status"></div>
<input type="file" id="file" accept="image/*" multiple hidden>
<input type="file" id="import" accept="application/json,.json" hidden>
<input type="file" id="score-file" accept="image/*,application/pdf,.pdf" multiple hidden>
<input type="file" id="sc-cam" accept="image/*" capture="environment" hidden>
<input type="file" id="sc-lib" accept="image/*" multiple hidden>
<input type="file" id="xml-file" hidden>
<input type="file" id="audio-file" accept="audio/*,.m4a,.mp3,.wav,.aac" multiple hidden>

<script>
(function(){
"use strict";
const COLS=['members','songs','shows','rehearsals','notices','ink'];
const PARTS=[['S','女高'],['A','女中'],['T','男高'],['B','男低']];
const PARTNAME=Object.fromEntries(PARTS);
const GROUPS=['桃劇坊','曜星','綻星','銀星'];
const TITLES={shows:'演出',reh:'團練',songs:'曲目',members:'成員',notices:'公告'};
const SHOT_TAGS=['截圖','場幕表','站位圖','通知','照片'];
const INFO=[['call','集合'],['rehearsal','彩排'],['dress','服裝'],['bring','攜帶'],['transport','交通／停車'],['rest','休息區'],['meal','聚餐'],['notes','其他提醒']];
const LS='chorus-app-v1';
/* Snapshot of the cloud data (2026/10/10), shown only when this view cannot reach the cloud database. */
const SNAP={};
let S={}; COLS.forEach(c=>S[c]={});
let db=null, assets=null, sample=null, canImages=false, downloads=null, mode='loading';
let usingSnap=false;
let tab='shows', openShow=null, openSong=null, fileTarget=null, showSeg='info', memFilter='全部', memQ='', songQ='';
const mem={}; // assetId -> File picked in this view (sent to Claude without refetching)

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toLocaleDateString('sv-SE');
const clone=o=>JSON.parse(JSON.stringify(o??{}));
function parseD(s){if(!s)return null;const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function fmtD(s,y){const d=parseD(s);if(!d)return '日期未定';return (y?d.getFullYear()+'/':'')+(d.getMonth()+1)+'/'+d.getDate()+'（'+'日一二三四五六'[d.getDay()]+'）'}
const arr=col=>Object.entries(S[col]).map(([id,v])=>({id,...v}));
const byDate=(a,b)=>(a.date||'9999')<(b.date||'9999')?-1:(a.date||'9999')>(b.date||'9999')?1:0;
/* On GitHub Pages there is no Claude runtime: data syncs through OneDrive (origina-sync.js) and stored screenshots ship in shots/. */
const PAGES=/github\.io$/.test(location.hostname);
const SHOT_FILES={c8e7b4fe67fe04b645d7cb8e6d052009:'01.png','8d8a99aeea4bac2f5bb174ffd762c23c':'02.png','9be563dea523edb5cd2e459f3a5dbba5':'03.png','63902affab81966d983d01791c84043a':'04.png',cd7d816b0c2df6cc7cd649118b4b5e38:'05.png','28cdec873847edee900203458d008e66':'06.png',faa772d13766d9a27ebbe929ba5aa748:'07.png','280770e5a7d2d4cd626069578dde9a3c':'08.png',fb2db3f5b3258533d7ab2c2dae32a7c6:'09.png',aedad3059f40070e5b281562cb50e164:'10.png',e233f16b43ad71c41641f3feb0876ca7:'scenes-pm.pdf'};
const PAGES_SHOTS=false; // screenshots stay out of the public repo unless the user decides otherwise
const NO_SHOTS=PAGES&&!PAGES_SHOTS;
const blobUrl=id=>PAGES&&SHOT_FILES[id]?'shots/'+SHOT_FILES[id]:'/_blob/'+id;
const linkHref=u=>{const m=/^\/_blob\/([0-9a-f]{32})$/.exec(u||'');return m?blobUrl(m[1]):u};
const linkify=s=>esc(s).replace(/https?:\/\/[^\s<]+/g,u=>'<a class="link" href="'+u+'" target="_blank" rel="noopener">'+u+'</a>');
function partChip(p){return p?'<span class="part p'+p+'" title="'+PARTNAME[p]+'">'+p+'</span>':'<span class="part">？</span>'}

/* ---------- storage ---------- */
function saveCache(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function loadCache(){try{const v=JSON.parse(localStorage.getItem(LS)||'null');if(v)COLS.forEach(c=>S[c]=v[c]||{})}catch(e){}}
const wq={};
function put(col,id,obj){
  S[col][id]=obj; saveCache(); scheduleRender();
  if(!db)return;
  const k=col+'/'+id,q=wq[k]||(wq[k]={busy:false,val:undefined});
  q.val=obj; if(!q.busy)flush(k,col,id);
}
async function flush(k,col,id){
  const q=wq[k]; q.busy=true;
  while(q.val!==undefined){
    const v=q.val; q.val=undefined;
    const go=()=>v===null?db.collection(col).doc(id).delete():db.collection(col).doc(id).set(v);
    try{await go()}catch(e){try{await new Promise(r=>setTimeout(r,600+Math.random()*600));await go()}catch(e2){toast('沒有存到雲端（'+(e2.code||'連線問題')+'），稍後再按一次儲存')}}
  }
  q.busy=false;
}
function del(col,id){delete S[col][id];saveCache();scheduleRender();if(!db)return;const k=col+'/'+id,q=wq[k]||(wq[k]={busy:false,val:undefined});q.val=null;if(!q.busy)flush(k,col,id)}

/* ---------- render ---------- */
let rq=false;
function scheduleRender(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;render()})}
function render(){
  const inShow=tab==='shows'&&openShow&&S.shows[openShow], inSong=tab==='songs'&&openSong&&S.songs[openSong];
  $('#title').innerHTML=inShow?'<button class="back" data-act="close-show" aria-label="回演出列表">‹</button><span>'+esc(S.shows[openShow].title||'演出')+'</span>':inSong?'<button class="back" data-act="close-song" aria-label="回曲目列表">‹</button><span>曲目</span>':esc(TITLES[tab]);
  $('#title').style.fontSize=inShow?'20px':'';
  $('#sync').textContent=mode==='cloud'?'已同步':mode==='local'?(PAGES?'OneDrive 同步：看右下角雲朵':'只存在這台裝置'):'載入中…';
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));
  const f=document.activeElement&&document.activeElement.id;
  const empty=COLS.every(c=>!Object.keys(S[c]).length);
  if(mode==='loading'&&empty){$('#main').innerHTML='<div class="empty"><div class="think" style="justify-content:center"><span class="dot"></span>正在連上雲端資料…</div></div>';return}
  const warn=mode==='local'&&!PAGES?'<div class="banner warn" style="margin-bottom:14px">這個畫面沒有連上雲端資料庫，'+(usingSnap?'現在顯示的是 10/10 的備份內容，':'')+'修改只會存在這台裝置。請從 claude.ai 或 Claude App 登入後開啟這個 app。</div>':'';
  if(PZ.playing&&!R.on&&!(inSong&&openSong===PZ.id))pzStop(); // the reader saves ink while the piano plays; that must not stop it
  if(inSong&&(PZ.playing||[...document.querySelectorAll('#main audio')].some(a=>!a.paused)))return; // re-rendering would stop what is playing
  $('#main').innerHTML=warn+(inShow?vShow(openShow):inSong?vSong(openSong):{shows:vShows,reh:vReh,songs:vSongs,members:vMembers,notices:vNotices}[tab]());
  hydrate($('#main'));
  document.querySelectorAll('#main canvas.tink').forEach(drawThumbInk);
  if(inSong&&S.songs[openSong].xml){if(PZ.id===openSong&&(PZ.score||PZ.err))pzPanel();else{pzPanel();pzLoad(openSong)}}
  if(f==='mem-q'||f==='song-q'){const i=$('#'+f);if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
}

/* ---------- 演出 list ---------- */
function vShows(){
  const all=arr('shows').sort(byDate), t=today();
  const up=all.filter(s=>!s.date||s.date>=t), past=all.filter(s=>s.date&&s.date<t).reverse();
  const nx=up[0];
  let h='';
  if(nx){
    h+='<section class="sec"><span class="label">下一場</span>'+heroCard(nx)+'</section>';
  }
  h+='<section class="sec"><div class="sec-head"><h2>全部演出</h2><button class="btn sm primary" data-act="new-show">＋ 新增演出</button></div>';
  if(!all.length)h+='<div class="empty">'+(PAGES?'還沒有資料。到 Claude 版的合唱團 App 按「下載備份」，再回來按下面的「匯入備份」。':'還沒有演出。按「新增演出」，再把 LINE 截圖丟進去整理。')+'</div>';
  else h+='<ul class="list">'+[...up.slice(nx?1:0),...past].map(showRow).join('')+'</ul>';
  h+='</section>';
  h+='<div class="btns">'+(downloads?'<button class="btn sm" data-act="backup">下載備份</button>':'')+'<button class="btn sm" data-act="import">匯入備份</button></div>';
  return h;
}
function heroCard(s){
  const days=s.date?Math.round((parseD(s.date)-parseD(today()))/864e5):null;
  return '<button class="hero" data-act="open-show" data-id="'+s.id+'">'
    +'<div class="chips">'+(days===0?'<span class="chip accent">今天</span>':days>0?'<span class="chip accent">還有 '+days+' 天</span>':'')+'<span class="chip">'+(s.scenes||[]).length+' 個場幕</span><span class="chip">'+(s.cast||[]).length+' 人參與</span></div>'
    +'<div class="when">'+esc(fmtD(s.date,true))+'</div><div class="what">'+esc(s.title||'未命名演出')+'</div>'
    +'<dl class="kv">'+(s.place?'<dt>地點</dt><dd>'+esc(s.place)+'</dd>':'')+(s.call?'<dt>集合</dt><dd>'+esc(s.call)+'</dd>':'')+(s.time?'<dt>演出</dt><dd>'+esc(s.time)+'</dd>':'')+'</dl></button>';
}
function showRow(s){
  const done=s.date&&s.date<today();
  return '<li><button class="row" data-act="open-show" data-id="'+s.id+'"><div class="main"><div class="title">'+esc(s.title||'未命名演出')+'</div><div class="sub">'+esc(fmtD(s.date,true))+(s.place?' · '+esc(s.place):'')+'</div></div>'+(done?'<span class="chip ok">已演出</span>':'<span class="chip accent">準備中</span>')+'</button></li>';
}

/* ---------- 演出 detail ---------- */
function vShow(id){
  const s=S.shows[id];
  const segs=[['info','行政'],['scenes','場幕表'],['setlist','歌單'],['cast','站位與名單'],['shots','截圖'],['after','演出後']];
  let h='<div class="seg" role="group" aria-label="演出內容">'+segs.map(([k,l])=>'<button data-act="show-seg" data-k="'+k+'" aria-pressed="'+(showSeg===k)+'">'+l+'</button>').join('')+'</div><div style="height:14px"></div>';
  h+={info:vInfo,scenes:vScenes,setlist:vSetlist,cast:vCast,shots:vShots,after:vAfter}[showSeg](s,id);
  return h;
}
function aiBar(id){
  if(!sample)return PAGES?'<div class="small muted">上傳截圖讓 Claude 整理，要從 Claude App 裡的合唱團開啟才能用。</div>':'';
  return '<div class="panel" style="display:grid;gap:8px"><div class="small muted">把 LINE 截圖、場幕表丟進來，Claude 會讀出時間、地點、服裝、場幕等資料，你確認後再填進卡片。截圖會一起保存。</div><div class="btns"><button class="btn primary sm" data-act="ai-pick" data-id="'+id+'"'+(assets&&canImages?'':' disabled')+'>上傳截圖並整理</button>'+((S.shows[id].shots||[]).length&&canImages?'<button class="btn sm" data-act="ai-saved" data-id="'+id+'">重新整理已存截圖</button>':'')+'</div>'+(!assets?'<div class="small muted">只有可以編輯的人能上傳截圖。</div>':'')+'</div>';
}
function vInfo(s,id){
  let h='<section class="sec">'+aiBar(id)+'</section>';
  h+='<section class="sec"><div class="sec-head"><h2>基本資料</h2><button class="ghost" data-act="edit-show" data-id="'+id+'">編輯</button></div><div class="panel"><dl class="kv">'
    +'<dt>日期</dt><dd>'+esc(fmtD(s.date,true))+'</dd>'
    +'<dt>名稱</dt><dd>'+esc(s.title||'')+'</dd>'
    +(s.place?'<dt>地點</dt><dd>'+esc(s.place)+'</dd>':'')
    +(s.time?'<dt>演出時間</dt><dd>'+esc(s.time)+'</dd>':'')
    +INFO.filter(([k])=>s[k]).map(([k,l])=>'<dt>'+l+'</dt><dd>'+linkify(s[k])+'</dd>').join('')
    +'</dl></div></section>';
  const links=s.links||[];
  h+='<section class="sec"><div class="sec-head"><h2>連結</h2><button class="ghost" data-act="add-link" data-id="'+id+'">＋ 新增</button></div>';
  h+=links.length?'<ul class="list">'+links.map((l,i)=>'<li class="row"><div class="main"><a class="link" href="'+esc(linkHref(l.url))+'" target="_blank" rel="noopener">'+esc(l.label||l.url)+'</a></div><button class="ghost" data-act="del-link" data-id="'+id+'" data-i="'+i+'" aria-label="刪除連結">✕</button></li>').join('')+'</ul>':'<div class="empty small">彩排影片、地圖、雲端譜都可以放這裡。</div>';
  h+='</section>';
  const ns=arr('notices').filter(n=>n.showId===id).sort(byDate);
  h+='<section class="sec"><div class="sec-head"><h2>相關公告</h2><button class="ghost" data-act="new-notice" data-show="'+id+'">＋ 新增</button></div>';
  h+=ns.length?'<ul class="list">'+ns.map(noticeRow).join('')+'</ul>':'<div class="empty small">團服取還、聚餐登記這類通知。</div>';
  h+='</section>';
  return h;
}
function vScenes(s,id){
  const sc=s.scenes||[];
  let h='<section class="sec">'+aiBar(id)+'</section><section class="sec"><div class="sec-head"><h2>場幕表</h2><button class="btn sm primary" data-act="edit-scene" data-id="'+id+'" data-i="-1">＋ 場幕</button></div>';
  if(!sc.length)return h+'<div class="empty">還沒有場幕。可以上傳場幕表截圖讓 Claude 整理。</div></section>';
  const blocks=[];sc.forEach((x,i)=>{const b=x.block||'';let g=blocks.find(g=>g.b===b);if(!g)blocks.push(g={b,items:[]});g.items.push([x,i])});
  h+='<ul class="list">'+blocks.map(g=>(g.b?'<li class="blockhead"><span>'+esc(g.b)+'</span><span>'+g.items.length+' 幕</span></li>':'')+g.items.map(([x,i])=>{
    const meta=[x.cast,x.area,x.instr,x.props].filter(Boolean).join(' · ');
    return '<li><button class="scene" data-act="edit-scene" data-id="'+id+'" data-i="'+i+'"><span class="no">'+esc(x.no||'')+'</span><div><div class="song">'+esc(x.song||x.name||'—')+'</div><div class="meta">'+(x.name&&x.song?esc(x.name)+' · ':'')+esc(meta)+'</div></div>'+(x.note?'<div class="note">'+esc(x.note)+'</div>':'')+'</button></li>';
  }).join('')).join('')+'</ul></section>';
  return h;
}
function vCast(s,id){
  const cast=(s.cast||[]).filter(m=>S.members[m]);
  const seat=(s.shots||[]).filter(x=>x.tag==='站位圖');
  let h='<section class="sec"><div class="sec-head"><h2>站位圖</h2></div>';
  h+=NO_SHOTS&&seat.length?'<div class="empty small">站位圖存在 Claude 版的合唱團 App 裡。</div>':seat.length?seat.map(x=>'<button class="shot" style="aspect-ratio:auto;width:100%" data-act="view-shot" data-id="'+id+'" data-a="'+x.id+'"><img src="'+blobUrl(x.id)+'" alt="站位圖" loading="lazy"></button>').join(''):'<div class="empty small">在「截圖」把一張圖標成「站位圖」，就會顯示在這裡。</div>';
  h+='</section>';
  const cnt={S:0,A:0,T:0,B:0,'':0};cast.forEach(m=>cnt[S.members[m].part||'']++);
  h+='<section class="sec"><div class="sec-head"><h2>參與名單 '+cast.length+' 人</h2><button class="ghost" data-act="pick-cast" data-id="'+id+'">選擇</button></div>';
  h+='<div class="tiles">'+PARTS.map(([p,n])=>'<div class="tile"><b class="num">'+cnt[p]+'</b><span>'+n+' '+p+'</span></div>').join('')+'</div>';
  h+=cast.length?'<ul class="list">'+PARTS.concat([['','未分聲部']]).map(([p,n])=>{const ms=cast.filter(m=>(S.members[m].part||'')===p);return ms.length?'<li class="glabel">'+n+'</li>'+ms.map(m=>'<li class="row">'+partChip(p)+'<div class="main">'+esc(S.members[m].name)+'</div></li>').join(''):''}).join('')+'</ul>':'<div class="empty small">還沒選參與的成員。</div>';
  h+='</section>';
  return h;
}
function vShots(s,id){
  const sh=s.shots||[];
  let h='<section class="sec">'+aiBar(id)+'</section><section class="sec"><div class="sec-head"><h2>原始截圖 '+sh.length+' 張</h2>'+(assets?'<button class="ghost" data-act="add-shots" data-id="'+id+'">＋ 只上傳</button>':'')+'</div>';
  h+=NO_SHOTS&&sh.length?'<div class="empty small">這 '+sh.length+' 張截圖存在 Claude 版的合唱團 App 裡，GitHub 版不放截圖（倉庫是公開的）。</div>':sh.length?'<div class="shots">'+sh.map(x=>'<button class="shot" data-act="view-shot" data-id="'+id+'" data-a="'+x.id+'"><img src="'+blobUrl(x.id)+'" alt="'+esc(x.tag||'截圖')+'" loading="lazy"><span class="tag">'+esc(x.tag||'截圖')+'</span></button>').join('')+'</div>':'<div class="empty small">還沒有截圖。</div>';
  return h+'</section>';
}
function vAfter(s,id){
  return '<section class="sec"><div class="sec-head"><h2>演出後</h2><button class="ghost" data-act="edit-after" data-id="'+id+'">編輯</button></div>'
    +'<div class="panel"><dl class="kv"><dt>心得</dt><dd>'+(s.review?linkify(s.review):'<span class="muted">還沒寫</span>')+'</dd><dt>照片／影片</dt><dd>'+(s.media?linkify(s.media):'<span class="muted">—</span>')+'</dd></dl></div></section>'
    +'<section class="sec"><button class="btn warn sm" data-act="del-show" data-id="'+id+'">刪除這場演出</button></section>';
}

/* ---------- 團練 ---------- */
function vReh(){
  const all=arr('rehearsals').sort(byDate).reverse();
  let h='<section class="sec"><div class="sec-head"><h2>團練紀錄</h2><button class="btn sm primary" data-act="edit-reh" data-id="">＋ 新增</button></div>';
  if(!all.length)return h+'<div class="empty">還沒有團練紀錄。</div></section>';
  h+='<ul class="list">'+all.map(r=>{const songs=(r.songs||[]).map(x=>S.songs[x]&&S.songs[x].title).filter(Boolean);

let pickTarget=null, pickAi=false;
$('#file').addEventListener('change',async e=>{
  const files=[...e.target.files];e.target.value='';
  if(!files.length||!pickTarget)return;
  const id=pickTarget, ai=pickAi;

    try{const r=await assets.upload(f,f.type?undefined:{type:'image/png'});ids.push(r.id);mem[r.id]=f}
    catch(err){toast(err.code==='quota_exceeded'?'空間不夠了':'有一張沒上傳成功（'+(err.code||'錯誤')+'）')}
  }
  if(ids.length){const sh=clone(S.shows[id]);sh.shots=[...(sh.shots||[]),...ids.map(x=>({id:x,tag:'截圖'}))];put('shows',id,sh);toast('已保存 '+ids.length+' 張截圖')}

$('#import').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;

  const n=COLS.reduce((a,c)=>a+Object.keys(data[c]||{}).length,0);
  if(!confirm('匯入 '+n+' 筆資料？同名的資料會被備份檔取代。'))return;

async function savedBlobs(id){

  }

const AI_FIELDS=[['title','名稱'],['date','日期'],['time','演出時間'],['place','地點'],...INFO];
async function aiRun(id,blobs){
  if(!blobs.length){toast('讀不到截圖，請用「上傳截圖並整理」重新選檔');return}
  const lim=await sample.limits().catch(()=>null);
  const max=lim&&lim.images?lim.images.maxCount:0;
  if(!max){toast('這個檢視無法傳圖片給 Claude');return}
  const batch=blobs.slice(0,max);
  const ctl=new AbortController();
  sheet('Claude 整理中','<div class="think"><span class="dot"></span><span id="ai-msg">正在讀 '+batch.length+' 張截圖…（約半分鐘到一分鐘）</span></div>'+(blobs.length>max?'<div class="banner warn">一次最多 '+max+' 張，這次先整理前 '+max+' 張。</div>':'')+'<button class="btn" data-act="ai-stop">停止</button>',null,{ctl});
  const s=S.shows[id];
  const cur={};AI_FIELDS.forEach(([k])=>cur[k]=s[k]||'');
  const songs=arr('songs').map(x=>x.title);
  const prompt='你是合唱團的行政小幫手。附上的圖片是合唱團 LINE 群組的截圖、通知、場幕表或站位圖，都和同一場演出有關。請把裡面的資訊整理成 JSON，用繁體中文，保留原文的時間、小節號（例如 #116）和人名，不要編造圖片裡沒有的內容。\n\n'
    +'目前卡片內容（今天是 '+today()+'）：\n'+JSON.stringify(cur)+'\n已有場幕數：'+(s.scenes||[]).length+'\n曲目庫：'+JSON.stringify(songs)+'\n\n'
    +'只回 JSON，格式：\n{"fields":{"title":"","date":"YYYY-MM-DD","time":"演出時間","place":"","call":"集合時間與地點","rehearsal":"彩排時間地點","dress":"服裝","bring":"要帶的東西（例如樂譜）","transport":"交通與停車","rest":"休息區","meal":"聚餐","notes":"其他提醒"},'
    +'"scenes":[{"block":"段落名，例如 上午 記者會 10:30-10:40 悅心亭前","no":"1-1","name":"場幕名稱","song":"曲目","cast":"演出人員或團體","area":"區域","instr":"樂器","props":"道具設備","note":"走位與備註，保留小節號"}],'
    +'"notices":[{"title":"","body":""}],"links":[{"label":"","url":""}],"songs":["曲目庫沒有的新歌名"],"shotTags":["每張圖的類型，依序，只能是：截圖、場幕表、站位圖、通知、照片"]}\n'
    +'fields 只放圖片裡有提到的欄位，沒有的就省略。scenes 只在有場幕表時才填，每一幕一筆。notices 放與演出相關但不屬於上面欄位的事務（例如團服取還、聚餐登記）。';
  try{
    const out=await sample.json(prompt,{images:batch,signal:ctl.signal,onText:()=>{const m=$('#ai-msg');if(m)m.textContent='整理中…'}});
    if(!$('#sheet').hidden)closeSheet();
    aiReview(id,out||{},blobs.length);
  }catch(e){
    if(!$('#sheet').hidden)closeSheet();
    if(e.code==='cancelled')return;
    if(e.code==='not_granted'){toast('沒有允許使用 Claude');return}
    if(e.code==='rate_limited'){toast('Claude 忙碌中，稍等一下再試');return}
    toast('整理失敗（'+(e.code||'錯誤')+'），截圖已經存好了');
  }
}
function aiReview(id,out,nShots){
  const s=S.shows[id];
  const f=out.fields||{};
  const props=AI_FIELDS.filter(([k])=>f[k]&&String(f[k]).trim()&&String(f[k]).trim()!==(s[k]||'').trim());
  const scenes=Array.isArray(out.scenes)?out.scenes.filter(x=>x&&(x.song||x.name)):[];
  const notices=Array.isArray(out.notices)?out.notices.filter(x=>x&&(x.title||x.body)):[];
  const links=Array.isArray(out.links)?out.links.filter(x=>x&&/^https?:\/\//.test(x.url||'')&&!(s.links||[]).some(l=>l.url===x.url)):[];
  const have=new Set(arr('songs').map(x=>x.title));
  const newSongs=Array.isArray(out.songs)?[...new Set(out.songs.map(String).map(x=>x.trim()).filter(x=>x&&!have.has(x)))]:[];
  if(!props.length&&!scenes.length&&!notices.length&&!links.length&&!newSongs.length){toast('截圖裡沒有找到新的資料');return}

/* ---------- files: score pages and practice audio ---------- */
/* Claude version: files go to the artifact's asset store (/_blob/<id>).
   GitHub version: files stay in IndexedDB on this device and upload to OneDrive (Origina/Chorus/files/<id>), so a score still opens offline on stage. */
const Files={
  urls:{}, p:{}, idb:null, uploading:false,
  open(){return this.idb||(this.idb=new Promise((ok,bad)=>{const r=indexedDB.open('chorus-files',1);r.onupgradeneeded=()=>{r.result.createObjectStore('blob');r.result.createObjectStore('pending')};r.onsuccess=()=>ok(r.result);r.onerror=()=>bad(r.error)}))},
  async tx(store,mode,fn){const d=await this.open();return new Promise((ok,bad)=>{const t=d.transaction(store,mode),r=fn(t.objectStore(store));t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>bad(t.error)})},
  getLocal(id){return this.tx('blob','readonly',s=>s.get(id)).catch(()=>null)},
  setLocal(id,b){return this.tx('blob','readwrite',s=>s.put(b,id)).catch(()=>{})},
  remote(){const o=window.OriginaSync;return PAGES&&o&&o.api?o:null},
  path(id){return (this.remote().folder()||'Chorus')+'/files/'+id},
  isAsset:id=>/^[0-9a-f]{32}$/.test(id),
  async add(blob,ext){
    if(assets&&!PAGES){const r=await assets.upload(blob);this.urls[r.id]=URL.createObjectURL(blob);return r.id}
    const id=uid('f')+'.'+ext;
    await this.setLocal(id,blob);this.urls[id]=URL.createObjectURL(blob);
    await this.tx('pending','readwrite',s=>s.put(1,id)).catch(()=>{});
    this.upload();
    return id;
  },
  async upload(){
    const o=this.remote();if(!o||this.uploading)return;this.uploading=true;
    try{
      const ids=await this.tx('pending','readonly',s=>s.getAllKeys())||[];
      for(const id of ids){const b=await this.getLocal(id);if(b)await o.api.putBlob(this.path(id),b);await this.tx('pending','readwrite',s=>s.delete(id))}
    }catch(e){/* not signed in or offline: retried on the next add and whenever the app comes back to the foreground */}
    this.uploading=false;
  },
  url(id){
    if(!id)return Promise.resolve(null);
    if(this.urls[id])return Promise.resolve(this.urls[id]);
    return this.p[id]||(this.p[id]=(async()=>{
      if(this.isAsset(id))return PAGES?null:(this.urls[id]='/_blob/'+id);
      let b=await this.getLocal(id);
      if(!b){const o=this.remote();if(o){try{b=await o.api.getBlob(this.path(id))}catch(e){}if(b)await this.setLocal(id,b)}}
      return b?(this.urls[id]=URL.createObjectURL(b)):null;
    })().then(u=>{if(!u)delete this.p[id];return u}));
  },
  async blob(id){const u=await this.url(id);if(!u)return null;const r=await fetch(u);return r.ok?r.blob():null},
  remove(id){
    if(this.isAsset(id)){if(assets)assets.delete(id).catch(()=>{});return}
    this.tx('blob','readwrite',s=>s.delete(id)).catch(()=>{});this.tx('pending','readwrite',s=>s.delete(id)).catch(()=>{});
  }
};

  cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);

/* Perspective crop, ported from the insurance app's document scanner. k = four corners clockwise from top-left. */
function solveH(dst,src){
  const A=[];
  for(let i=0;i<4;i++){const[u,v]=dst[i],[x,y]=src[i];A.push([u,v,1,0,0,0,-u*x,-v*x,x]);A.push([0,0,0,u,v,1,-u*y,-v*y,y])}
  for(let c=0;c<8;c++){let p=c;for(let r=c+1;r<8;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;[A[c],A[p]]=[A[p],A[c]];for(let r=0;r<8;r++){if(r===c)continue;const f=A[r][c]/A[c][c];for(let k=c;k<9;k++)A[r][k]-=f*A[c][k]}}
  return A.map((r,i)=>r[8]/r[i]);
}
function warpImg(img,k,filter,level,max){
  const d=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  let W=Math.max(d(k[0],k[1]),d(k[3],k[2])),H=Math.max(d(k[0],k[3]),d(k[1],k[2]));const s=Math.min(1,(max||2200)/Math.max(W,H));W=Math.max(1,Math.round(W*s));H=Math.max(1,Math.round(H*s));
  const h=solveH([[0,0],[W,0],[W,H],[0,H]],k),sd=img.getContext('2d').getImageData(0,0,img.width,img.height).data,iw=img.width,ih=img.height;
  const out=document.createElement('canvas');out.width=W;out.height=H;const ox=out.getContext('2d'),od=ox.createImageData(W,H),o=od.data;
  let sum=0;
  for(let v=0;v<H;v++)for(let u=0;u<W;u++){
    const z=h[6]*u+h[7]*v+1;let x=(h[0]*u+h[1]*v+h[2])/z,y=(h[3]*u+h[4]*v+h[5])/z;
    x=Math.min(iw-1,Math.max(0,x|0));y=Math.min(ih-1,Math.max(0,y|0));
    const si=(y*iw+x)*4,oi=(v*W+u)*4;o[oi]=sd[si];o[oi+1]=sd[si+1];o[oi+2]=sd[si+2];o[oi+3]=255;sum+=.3*sd[si]+.59*sd[si+1]+.11*sd[si+2];

    for(let i=0;i<o.length;i+=4){

}

function hitErase(strokes,x,y,r){

/* Ink is stored per page in page pixels (the 'ink' collection, keyed by the page's file id), so it lines up at any screen size. */

/* ---------- 鋼琴彈旋律：MusicXML → piano (Web Audio) ---------- */
/* The score is turned into MusicXML elsewhere (PlayScore 2, MuseScore + Audiveris); here it is only read and played. */
async function unzipMain(buf){ // .mxl is a zip: find the score named in META-INF/container.xml
  const dv=new DataView(buf);let e=buf.byteLength-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error('壓縮檔讀不出來');
  const files={};let p=dv.getUint32(e+16,true);
  for(let i=0,n=dv.getUint16(e+10,true);i<n;i++){
    const nl=dv.getUint16(p+28,true),name=new TextDecoder().decode(new Uint8Array(buf,p+46,nl));
    files[name]={method:dv.getUint16(p+10,true),size:dv.getUint32(p+20,true),off:dv.getUint32(p+42,true)};
    p+=46+nl+dv.getUint16(p+30,true)+dv.getUint16(p+32,true);
  }
  const read=async name=>{
    const f=files[name],l=f.off,data=new Uint8Array(buf,l+30+dv.getUint16(l+26,true)+dv.getUint16(l+28,true),f.size);
    return f.method===0?new TextDecoder().decode(data):new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  };
  let root=null;
  if(files['META-INF/container.xml']){const m=/full-path="([^"]+)"/.exec(await read('META-INF/container.xml'));if(m&&files[m[1]])root=m[1]}
  root=root||Object.keys(files).find(k=>!k.startsWith('META-INF')&&/\.(xml|musicxml)$/i.test(k));
  if(!root)throw new Error('壓縮檔裡沒有樂譜');
  return read(root);
}
async function musicXmlText(blob){const buf=await blob.arrayBuffer(),u=new Uint8Array(buf,0,2);return u[0]===0x50&&u[1]===0x4B?unzipMain(buf):blob.text()}
function parseMusicXml(text){
  const doc=new DOMParser().parseFromString(text,'application/xml');
  if(doc.querySelector('parsererror')||!doc.querySelector('score-partwise'))throw new Error('這不是 MusicXML 譜（要 score-partwise 格式）');
  const STEP={C:0,D:2,E:4,F:5,G:7,A:9,B:11},txt=(el,s)=>{const x=el.querySelector(s);return x?x.textContent.trim():''};
  const names={};doc.querySelectorAll('part-list score-part').forEach(sp=>names[sp.id]=txt(sp,'part-name')||txt(sp,'part-abbreviation'));
  const voices={},measures=[],tempos=[];
  [...doc.querySelectorAll('score-partwise>part')].forEach((part,pi)=>{
    let div=1,q0=0;const open={};
    [...part.children].filter(m=>m.tagName==='measure').forEach((m,mi)=>{
      if(pi===0)measures.push({n:m.getAttribute('number')||String(mi+1),q:q0});
      let pos=0,max=0,last=0;
      for(const el of m.children){
        const t=el.tagName;
        if(t==='attributes'){const d=txt(el,'divisions');if(d)div=+d||1}
        else if(t==='backup')pos-=+txt(el,'duration')||0;
        else if(t==='forward'){pos+=+txt(el,'duration')||0;max=Math.max(max,pos)}
        else if(t==='direction'||t==='sound'){
          const s=t==='sound'?el:el.querySelector('sound'),bpm=+(s&&s.getAttribute('tempo'))||(+txt(el,'metronome per-minute')*({half:2,eighth:.5,'quarter':1}[txt(el,'metronome beat-unit')]||1));
          if(bpm&&pi===0)tempos.push({q:q0+pos/div,bpm});
        }
        else if(t==='note'){
          if(el.querySelector('grace'))continue;
          const dur=+txt(el,':scope>duration')||0,chord=!!el.querySelector(':scope>chord'),start=chord?last:pos;
          if(!chord){last=pos;pos+=dur;max=Math.max(max,pos)}
          const pt=el.querySelector(':scope>pitch');if(!pt||el.querySelector(':scope>rest'))continue;
          const midi=12*(+txt(pt,'octave')+1)+STEP[txt(pt,'step')]+Math.round(+txt(pt,'alter')||0);
          const key=pi+'|'+(txt(el,':scope>staff')||'1')+'|'+(txt(el,':scope>voice')||'1');
          const vo=voices[key]||(voices[key]={key,part:pi,name:names[part.id]||'',notes:[]});
          const q=q0+start/div,len=dur/div,ties=[...el.querySelectorAll(':scope>tie')].map(x=>x.getAttribute('type')),ok=key+'|'+midi;
          if(ties.includes('stop')&&open[ok])open[ok].len=q+len-open[ok].q;
          else{const n={q,len,midi};vo.notes.push(n);open[ok]=n}
          if(!ties.includes('start'))delete open[ok];
        }
      }
      q0+=max/div;
    });
  });
  const list=Object.values(voices).filter(v=>v.notes.length);
  if(!list.length)throw new Error('檔案裡找不到音符');
  list.forEach(v=>v.avg=v.notes.reduce((a,n)=>a+n.midi,0)/v.notes.length);
  // within each part, name voices from high to low so 「上聲部」 is the soprano line of a two-voice staff
  const byPart={};list.forEach(v=>(byPart[v.part]=byPart[v.part]||[]).push(v));
  Object.values(byPart).forEach(vs=>{vs.sort((a,b)=>b.avg-a.avg);vs.forEach((v,i)=>v.label=(v.name||'第 '+(v.part+1)+' 部')+(vs.length>1?'・'+(i===0?'上聲部':i===vs.length-1?'下聲部':'中間第 '+i+' 聲部'):''))});
  list.sort((a,b)=>a.part-b.part||b.avg-a.avg);
  const sop=list.find(v=>/sop|女高|^s\.?$|^s\b|^s\d/i.test(v.name))||list[0];
  tempos.sort((a,b)=>a.q-b.q);if(!tempos.length||tempos[0].q>0)tempos.unshift({q:0,bpm:tempos[0]?tempos[0].bpm:90});
  return{voices:list,def:sop.key,measures,tempos};
}
function scoreSec(sc,q){ // quarter-note position → seconds at written tempo
  let s=0;const T=sc.tempos;
  for(let i=0;i<T.length;i++){const a=T[i].q,b=i+1<T.length?Math.min(T[i+1].q,q):q;if(b<=a)break;s+=(b-a)*60/T[i].bpm}

const PZ={id:null,score:null,err:'',sel:'',from:1,rate:1,others:false,playing:false,ctx:null,timer:null};
function pianoNote(ctx,out,midi,t,dur,vel){
  const f=440*2**((midi-69)/12),g=ctx.createGain(),end=t+dur;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vel,t+.006);
  g.gain.setTargetAtTime(vel*.25,t+.006,.45); // piano tone fades even while the key is held
  g.gain.setTargetAtTime(0,end,.07);g.connect(out);
  [[1,1],[2,.42],[3,.2],[4,.09],[5,.05]].forEach(([h,a])=>{
    if(f*h>12000)return;const o=ctx.createOscillator(),og=ctx.createGain();
    o.frequency.value=f*h;og.gain.value=a;og.gain.setTargetAtTime(0,t,.25+.6/h);o.connect(og).connect(g);o.start(t);o.stop(end+.5);

async function pzLoad(id){
  const s=S.songs[id];if(!s||!s.xml)return;
  if(PZ.id===id&&(PZ.score||PZ.err))return;
  PZ.id=id;PZ.score=null;PZ.err='';PZ.from=1;
  try{const b=await Files.blob(s.xml.f);if(!b)throw new Error('讀不到檔案，連上網路後再開一次');PZ.score=parseMusicXml(await musicXmlText(b));PZ.sel=PZ.score.voices.some(v=>v.key===s.xml.voice)?s.xml.voice:PZ.score.def}

function pzPanel(){
  const el=$('#pz');if(!el||el.dataset.id!==PZ.id)return;
  if(PZ.err){el.innerHTML='<div class="small" style="color:var(--warn)">'+esc(PZ.err)+'</div>';return}
  if(!PZ.score){el.innerHTML='<div class="think"><span class="dot"></span>讀譜中…</div>';return}
  const sc=PZ.score,bpm=Math.round(sc.tempos[0].bpm);

    +'<div class="f2"><label class="f"><span>從第幾小節（共 '+sc.measures.length+'）</span><input id="pz-from" type="number" inputmode="numeric" min="1" max="'+sc.measures.length+'" value="'+PZ.from+'"></label>'
    +'<label class="f"><span>速度（原速 ♩='+bpm+'）</span><select id="pz-rate">'+[.5,.75,.9,1,1.1].map(r=>'<option value="'+r+'"'+(r===PZ.rate?' selected':'')+'>'+Math.round(r*100)+'%</option>').join('')+'</select></label></div>'
    +'<label class="check" style="padding:0;min-height:0"><input type="checkbox" id="pz-others"'+(PZ.others?' checked':'')+'>其他聲部小聲陪著</label>'
    +'<div class="btns" style="align-items:center"><button class="btn primary" data-act="pz-play" id="pz-play">'+(PZ.playing?'❚❚ 停止':'▶ 彈奏')+'</button><span class="small muted num" id="pz-pos"></span></div>';
}
function pzStop(keepPlace){
  if(PZ.timer)clearInterval(PZ.timer);PZ.timer=null;
  if(PZ.ctx){PZ.ctx.close().catch(()=>{});PZ.ctx=null}
  if(PZ.playing&&keepPlace&&PZ.at)PZ.from=PZ.at;
  PZ.playing=false;const b=$('#pz-play');if(b)b.textContent='▶ 彈奏';const f=$('#pz-from');if(f)f.value=PZ.from;
  if(R.on&&R.piano)rdTime();
}
function pzPlay(){
  const sc=PZ.score;if(!sc)return;
  const from=Math.max(1,Math.min(sc.measures.length,PZ.from|0||1)),q0=sc.measures[from-1].q,s0=scoreSec(sc,q0),rate=PZ.rate;
  const ev=[];sc.voices.forEach(v=>{const main=v.key===PZ.sel;if(!main&&!PZ.others)return;v.notes.forEach(n=>{if(n.q>=q0-1e-6)ev.push({t:(scoreSec(sc,n.q)-s0)/rate,d:(scoreSec(sc,n.q+n.len)-scoreSec(sc,n.q))/rate,midi:n.midi,vel:main?.5:.13})})});
  if(!ev.length){toast('從這裡開始沒有音符');return}

    const q=sc.measures;let m=from;const pos=s0+Math.max(0,now)*rate;while(m<q.length&&scoreSec(sc,q[m].q)<=pos)m++;PZ.at=m;
    const el=$('#pz-pos');if(el)el.textContent='第 '+q[m-1].n+' 小節';if(R.on&&R.piano)rdTime();
    if(now>endT+.6){pzStop();PZ.from=from;const f=$('#pz-from');if(f)f.value=from;const p=$('#pz-pos');if(p)p.textContent='彈完了'}
  };
  ctx.resume().then(()=>{tick();PZ.timer=setInterval(tick,100)});
}

document.addEventListener('change',e=>{

  if(t.id==='rd-rate'){AU.defaultPlaybackRate=AU.playbackRate=+t.value;PZ.rate=+t.value;if(R.piano&&PZ.playing){pzStop(true);pzPlay()}t.blur()}
  if(t.id==='rd-seek'){R.seeking=false;if(R.piano&&PZ.score){const p=PZ.playing;pzStop();PZ.from=1+Math.round(t.value/1000*(PZ.score.measures.length-1));if(p)pzPlay();rdTime()}else if(AU.duration)AU.currentTime=t.value/1000*AU.duration;t.blur()}

document.addEventListener('keydown',e=>{

/* A link ending in #import=<base64url gzip JSON> loads a backup without picking a file; the hash never reaches the server. */
async function importFromHash(){
  const m=/^#import=([A-Za-z0-9_-]+)$/.exec(location.hash||'');if(!m)return;
  history.replaceState(null,'',location.pathname+location.search);
  try{
    const b=atob(m[1].replace(/-/g,'+').replace(/_/g,'/'));const u=Uint8Array.from(b,c=>c.charCodeAt(0));
    const data=JSON.parse(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
    const n=COLS.reduce((a,c)=>a+Object.keys(data[c]||{}).length,0);
    const has=COLS.some(c=>Object.keys(S[c]).length)&&!usingSnap;
    if(has&&!confirm('匯入 '+n+' 筆資料？同名的資料會被取代。'))return;
    COLS.forEach(c=>Object.entries(data[c]||{}).forEach(([id,v])=>put(c,id,v)));usingSnap=false;toast('已匯入 '+n+' 筆資料');
  }catch(e){toast('匯入連結讀不出來')}
}
try{const tb=localStorage.getItem(LS+'-tab');if(tb&&TITLES[tb])tab=tb}catch(_){}

importFromHash();

(async()=>{
  const c=window.claude;
  if(c&&c.use){
    c.use('downloads').then(x=>{downloads=x;if(x)scheduleRender()}).catch(()=>{});
    c.use('assets').then(x=>{assets=x;scheduleRender()}).catch(()=>{});
    c.use('sample').then(async x=>{sample=x;if(x){const l=await x.limits().catch(()=>null);canImages=!!(l&&l.images)}scheduleRender()}).catch(()=>{});
    try{db=await c.use('db')}catch(e){db=null}
  }
  if(!db){mode='local';if(COLS.every(c=>!Object.keys(S[c]).length)){COLS.forEach(c=>S[c]=clone(SNAP[c]||{}));usingSnap=true}render();return}
  const pending=new Set(COLS);
  COLS.forEach(col=>{
    db.collection(col).onSnapshot(snap=>{
      const m={};snap.docs.forEach(d=>{m[d.id]=clone(d.data())});
      S[col]=m;pending.delete(col);if(!pending.size)mode='cloud';saveCache();scheduleRender();
    },err=>{if(err.code==='revoked'||err.code==='not_granted')mode='local';toast('雲端連線中斷，資料先存在這台裝置');scheduleRender()});
  });
})();
})();
